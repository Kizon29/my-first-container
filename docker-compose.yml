version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"  # (Change the left number to 8080 if you preferred that!)
    depends_on:
      - db
    environment:
      - DB_PASSWORD=${DB_PASSWORD}  # This passes the secret into the Python container

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # This sets the password for the vault
    ports:
      - "5432:5432"