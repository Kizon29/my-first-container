name: CI Pipeline - Docker Build & Push

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # The Official Docker Login Action (Bulletproof way to read secrets)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t my-cloud-app .

    - name: Tag the Image for Docker Hub
      run: docker tag my-cloud-app ${{ secrets.DOCKER_USERNAME }}/my-cloud-app:latest

    - name: Push Image to Docker Hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/my-cloud-app:latest