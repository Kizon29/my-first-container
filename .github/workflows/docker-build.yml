name: CI Pipeline - Docker Build

# 1. When should this run? Every time you push code.
on:
  push:
    branches: [ "main", "master" ]

# 2. What should it do? 
jobs:
  build-and-test:
    # 3. Spin up a fresh Ubuntu Linux server in the cloud
    runs-on: ubuntu-latest

    steps:
    # 4. Download your code onto that cloud server
    - name: Checkout Code
      uses: actions/checkout@v4

    # 5. Run the Docker build command automatically
    - name: Build Docker Image
      run: docker build -t my-cloud-app .